<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Inter', 'Segoe UI', Arial, sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9A948C"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C00000"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="44" font-size="26" font-weight="700" fill="#404040">Knowledge Graph und Produktkontext: der fehlende Satz</text>
  <rect x="40" y="56" width="130" height="4" rx="2" fill="#C00000"/>

  <!-- Column headers (aligned, above the boxes) -->
  <text x="147"  y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#C00000" letter-spacing="1">PRODUKTKONTEXT</text>
  <text x="147"  y="132" text-anchor="middle" font-size="13" font-style="italic" fill="#6B6B6B">der Rohstoff</text>
  <text x="600"  y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#C00000" letter-spacing="1">KNOWLEDGE GRAPH</text>
  <text x="600"  y="132" text-anchor="middle" font-size="13" font-style="italic" fill="#6B6B6B">die Form</text>
  <text x="1053" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#C00000" letter-spacing="1">VERWERTUNG</text>
  <text x="1053" y="132" text-anchor="middle" font-size="13" font-style="italic" fill="#6B6B6B">der Zweck</text>

  <!-- Boxes : narrower sides give the connectors a wide corridor; side boxes centered on the middle box (center y=394) -->
  <rect x="40"  y="246" width="214" height="296" rx="14" fill="#F5F2EE" stroke="#EAE6E0"/>
  <rect x="386" y="152" width="428" height="484" rx="14" fill="#FCFBF9" stroke="#EAE6E0"/>
  <rect x="946" y="290" width="214" height="208" rx="14" fill="#F5F2EE" stroke="#EAE6E0"/>

  <!-- Column A: content chips -->
  <g filter="url(#soft)">
    <rect x="52" y="266" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#E0DBD4"/>
    <rect x="52" y="326" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#E0DBD4"/>
    <rect x="52" y="386" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#E0DBD4"/>
    <rect x="52" y="446" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#E0DBD4"/>
  </g>
  <g fill="#404040" font-size="14" text-anchor="middle">
    <text x="147" y="293">Erfahrungswissen</text>
    <text x="147" y="353">Eignung und Situationen</text>
    <text x="147" y="413">Bewertungen</text>
    <text x="147" y="473">Kundenfragen</text>
  </g>
  <text x="147" y="512" text-anchor="middle" font-size="12" fill="#8A857E">lose und unstrukturiert,</text>
  <text x="147" y="528" text-anchor="middle" font-size="12" fill="#8A857E">für Maschinen unsichtbar</text>

  <!-- Flow connector A -> B : long thin arrow, light label above -->
  <text x="320" y="368" text-anchor="middle" font-size="13" fill="#6B6B6B">hängt an</text>
  <line x1="266" y1="382" x2="374" y2="382" stroke="#9A948C" stroke-width="1.6" marker-end="url(#arrowLight)"/>

  <!-- Graph edges (behind nodes) -->
  <g stroke="#B7B2AB" stroke-width="1.6">
    <line x1="600" y1="380" x2="480" y2="244"/>
    <line x1="600" y1="380" x2="720" y2="244"/>
    <line x1="600" y1="380" x2="480" y2="508"/>
    <line x1="600" y1="380" x2="720" y2="508"/>
  </g>
  <line x1="600" y1="346" x2="600" y2="216" stroke="#404040" stroke-width="1.8"/>
  <line x1="600" y1="414" x2="600" y2="552" stroke="#C00000" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>

  <!-- Satellite nodes -->
  <g filter="url(#soft)">
    <rect x="405" y="222" width="150" height="44" rx="9" fill="#FFFFFF" stroke="#404040"/>
    <rect x="645" y="222" width="150" height="44" rx="9" fill="#FFFFFF" stroke="#404040"/>
    <rect x="405" y="486" width="150" height="44" rx="9" fill="#FFFFFF" stroke="#404040"/>
    <rect x="645" y="486" width="150" height="44" rx="9" fill="#FFFFFF" stroke="#404040"/>
  </g>
  <g fill="#404040" font-size="14" text-anchor="middle">
    <text x="480" y="250">Einsatzkontext</text>
    <text x="720" y="250">Zielgruppe</text>
    <text x="480" y="514">Anlass</text>
    <text x="720" y="514">Berater (Quelle)</text>
  </g>

  <!-- Service node (own entity) -->
  <g filter="url(#soft)">
    <rect x="505" y="162" width="190" height="54" rx="9" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
  </g>
  <text x="600" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#C00000">Serviceleistung</text>
  <text x="600" y="206" text-anchor="middle" font-size="11.5" fill="#C00000">eigene Entität</text>

  <!-- Anchor node -->
  <g filter="url(#soft)">
    <rect x="505" y="346" width="190" height="68" rx="11" fill="#C00000"/>
  </g>
  <text x="600" y="377" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">HOTEL / ARTIKEL</text>
  <text x="600" y="398" text-anchor="middle" font-size="12" fill="#FFFFFF" opacity="0.92">stabiler Anker, feste ID</text>

  <!-- Composed product node -->
  <rect x="505" y="556" width="190" height="40" rx="9" fill="#FBE9E9" stroke="#C00000"/>
  <text x="600" y="581" text-anchor="middle" font-size="14" fill="#C00000">Pauschalreise / Bundle</text>
  <text x="600" y="620" text-anchor="middle" font-size="13" font-style="italic" fill="#C00000">Komposition aus Teilen: Beziehung, kein Anker</text>

  <!-- Flow connector B -> C : long thin arrow, light label above -->
  <text x="880" y="368" text-anchor="middle" font-size="13" fill="#6B6B6B">nutzbar</text>
  <line x1="826" y1="382" x2="934" y2="382" stroke="#9A948C" stroke-width="1.6" marker-end="url(#arrowLight)"/>

  <!-- Column C: consumption chips -->
  <g filter="url(#soft)">
    <rect x="958" y="312" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#E0DBD4"/>
    <rect x="958" y="372" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#E0DBD4"/>
    <rect x="958" y="432" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#E0DBD4"/>
  </g>
  <g fill="#404040" font-size="14" text-anchor="middle">
    <text x="1053" y="339">Beratung am Platz</text>
    <text x="1053" y="399">Chatbot</text>
    <text x="1053" y="459">KI-Sichtbarkeit</text>
  </g>

  <!-- Bottom sentence band -->
  <rect x="40" y="676" width="1120" height="72" rx="12" fill="#404040"/>
  <text x="600" y="706" text-anchor="middle" font-size="17" fill="#FFFFFF">Content ist der Rohstoff. Der Graph ist die Form.</text>
  <text x="600" y="731" text-anchor="middle" font-size="17" fill="#FFFFFF">Die Menschen mit Kundenkontakt sind die Quelle. Die Verwertung ist der Zweck.</text>

  <!-- Copyright -->
  <text x="1160" y="768" text-anchor="end" font-size="12" fill="#A8A5A0">© 2026 contraco</text>
</svg>
